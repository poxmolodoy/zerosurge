name: Release Portable Executable

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Windows Portable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Test
        run: |
          npx tsc --noEmit
          npm test
          npm run check:offline

      - name: Code Signing (Optional Authenticode)
        id: sign
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CSC_LINK }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if ($env:CERTIFICATE_BASE64 -and $env:CERTIFICATE_PASSWORD) {
            Write-Host "Authenticode certificate detected. Preparing signing credentials..."
            $certPath = "$env:TEMP\cert.pfx"
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
            $env:CSC_LINK = $certPath
            $env:CSC_KEY_PASSWORD = $env:CERTIFICATE_PASSWORD
          } else {
            Write-Host "No Authenticode certificate secrets provided. Generating unsigned release binary."
          }

      - name: Build Windows Portable Executable
        run: npm run electron:build:portable

      - name: Compute SHA256 Checksums
        shell: pwsh
        run: |
          $exePath = Get-ChildItem -Path release -Filter "*.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exePath) {
            throw "Executable not found in release/ directory!"
          }
          $fileName = [System.IO.Path]::GetFileName($exePath)
          $hash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash.ToLower()
          "$hash  $fileName" | Out-File -FilePath release\SHA256SUMS.txt -Encoding utf8
          Write-Host "Generated SHA256: $hash for $fileName"
          Get-Content release\SHA256SUMS.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-release
          path: |
            release/*.exe
            release/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
