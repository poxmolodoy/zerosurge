<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZeroSurge" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./pwa-192x192.png" />
    <meta
      name="description"
      content="ZeroSurge — современный трекер отказа от энергетиков и кофеина. Отслеживание экономии, био-восстановления организма, преодоление тяги и достижения."
    />
    <title>ZeroSurge — Свобода от стимуляторов и энергетиков</title>
    <!-- Strict Local Content Security Policy (No external telemetry or resources) -->
    <!-- Note: 'unsafe-inline' in style-src is required by framer-motion for dynamic spring/keyframe animation transforms -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self';"
    />
  </head>
  <body
    class="bg-dark-base text-slate-100 min-h-screen antialiased selection:bg-surge-emerald selection:text-black overflow-x-hidden"
  >
    <noscript>Для работы ZeroSurge необходим включенный JavaScript.</noscript>
    <div id="root">
      <div
        style="
          display: flex;
          height: 100vh;
          align-items: center;
          justify-content: center;
          background: #09090b;
          color: #10b981;
        "
      >
        <div
          style="
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #10b981;
            border-radius: 50%;
            animation: zs-spin 0.8s linear infinite;
          "
        ></div>
      </div>
    </div>
    <style>
      @keyframes zs-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
